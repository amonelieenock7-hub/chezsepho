<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Réservation · CHEZSEPHO.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>
// Mets ici le MÊME identifiant marchand Wave que dans paiement.html
const WAVE_MERCHANT = "M_ci_JEXThzuvMlTJ";
const WHATSAPP = "2250711336992";

let r = [], T = 0, day = get('rday', 0), slot = '18:00', done = null, nomClient = '';
let enCours = get('resaEnCours', null);   // réservation envoyée vers Wave, en attente de confirmation

const dt = o => { const d = new Date(); d.setDate(d.getDate() + o); return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) };
const end = s => { const [h, m] = s.split(':').map(Number), t = h * 60 + m + 15; return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const waveLien = S => 'https://pay.wave.com/m/' + WAVE_MERCHANT + '/c/ci/?amount=' + Math.round(S.T);
const quand = S => S.jourLabel + ' (' + S.date + '), de ' + S.slot + ' à ' + S.fin;

function recalcul() {
    r = toLines(get('resa', {}));
    T = r.reduce((s, l) => s + l.p * l.q, 0);
}

function messageWhatsApp(S) {
    return 'Bonjour Sepho ! Voici ma réservation CHEZSEPHO (paiement Wave effectué).\n\n' +
        'Réservation : ' + S.numero + '\n' +
        'Nom : ' + S.nom + '\n' +
        'Retrait : ' + quand(S) + '\n\n' +
        S.lignes.map(l => l.q + ' × ' + l.n + ' : ' + fmt(l.p * l.q)).join('\n') + '\n\n' +
        'Total payé : ' + fmt(S.T) + '\n\n' +
        'Merci de confirmer ma réservation.';
}

function draw() {
    // 3) Réservation confirmée
    if (done) {
        $('#app').innerHTML = head('Réservation · Envoyée') +
            `<h1 class="t">Votre pause gourmande vous attend.</h1>
            <div class="tk">
                <div class="ok"><b>Réservation envoyée à Sepho</b><small>Votre ticket : ${done.numero}</small></div>
                <span class="badge">Paiement Wave · en cours de vérification</span>
                <div style="margin:10px 0">${list(done.lignes)}</div>
                <div class="row"><span>${quand(done)}</span></div>
                <small>CHEZSEPHO. · point de retrait à confirmer</small>
                <div class="row tot"><span>Montant réglé</span><b>${fmt(done.T)}</b></div>
                <small>Sepho confirme votre réservation sur WhatsApp dès que le paiement est vérifié.</small>
            </div>
            <a class="btn full" href="index.html">Retour à la carte</a>`;
        return;
    }

    // 2) Retour de Wave : on propose d'envoyer le message WhatsApp
    if (enCours) {
        const S = enCours;
        $('#app').innerHTML = head('Réservation · Paiement') +
            `<h1 class="t">Une dernière étape.</h1>
            <p class="mut">Avez-vous payé sur Wave ? Si oui, envoyez votre réservation à Sepho pour qu'elle soit confirmée.</p>
            <div class="sum">
                <b>Réservation · ${S.numero}</b>
                ${list(S.lignes)}
                <div class="row"><span>${quand(S)}</span></div>
                <div class="row tot"><span>Montant à régler</span><b>${fmt(S.T)}</b></div>
            </div>
            <button class="btn full" data-sent style="background:#25D366; color:white;">
                J'ai payé · Envoyer ma réservation à Sepho
            </button>
            <p class="note">Le message est déjà rédigé avec votre date, votre créneau et votre commande.</p>
            <a class="link" href="${waveLien(S)}">Payer maintenant avec Wave</a>
            <a class="link" href="#" data-cancel>Annuler et refaire ma réservation</a>`;
        return;
    }

    if (!r.length) { $('#app').innerHTML = empty('Réservation'); return }

    // 1) Choix du jour, du créneau et du nom
    $('#app').innerHTML = head('Réservation · Retrait') +
        `<h1 class="t">Votre pause gourmande vous attend.</h1>
        <p class="mut">Choisissez votre créneau, puis payez avec Wave pour confirmer votre réservation.</p>
        <h2 class="h2">Jour de retrait</h2>
        <div class="two">${['Aujourd’hui', 'Demain'].map((x, i) => `<button class="chip slot ${day === i ? 'on' : ''}" data-day="${i}">${x} · ${dt(i)}</button>`).join('')}</div>
        <h2 class="h2">Créneau de retrait</h2>
        <div class="slots">${['17:30', '18:00', '18:30', '19:00'].map(s => `<button class="chip slot ${slot === s ? 'on' : ''}" data-s="${s}">${s}</button>`).join('')}</div>
        <h2 class="h2">Votre nom</h2>
        <input id="nom" type="text" autocomplete="name" placeholder="Ex : Jean Dupont" value="${esc(nomClient)}">
        <div class="sum">${list(r)}<div class="row tot"><span>Total à payer</span><b>${fmt(T)}</b></div></div>
        <p id="err" class="err" role="alert"></p>
        <button class="btn wavebtn full" data-pay>Payer ${fmt(T)} avec Wave</button>
        <p class="note">Vous serez redirigé vers Wave. Après le paiement, revenez ici pour envoyer votre réservation à Sepho.</p>`;
}

document.addEventListener('input', e => { if (e.target.id === 'nom') nomClient = e.target.value });

document.addEventListener('click', async e => {
    const a = e.target.closest('a[data-cancel]');
    if (a) {
        e.preventDefault();
        try { localStorage.removeItem('resaEnCours') } catch (x) {}
        enCours = null;
        draw();
        return;
    }

    const t = e.target.closest('button');
    if (!t) return;
    const d = t.dataset;

    if (d.day) { day = +d.day; draw() }
    if (d.s) { slot = d.s; draw() }

    // Étape 1 : enregistrer la réservation puis partir vers Wave
    if ('pay' in d) {
        const nom = (($('#nom') || {}).value || '').trim();
        const err = $('#err');
        err.style.display = 'none';

        if (!nom) {
            err.textContent = 'Entrez votre nom pour continuer.';
            err.style.display = 'block';
            return;
        }
        nomClient = nom;
        t.disabled = true;

        let numero;
        try {
            if (typeof sb !== 'undefined' && sb) {
                await ensureAuth();
                const { data, error } = await sb.rpc('creer_reservation', { p_items: items(r), p_jour: ymd(day), p_creneau: slot });
                if (error) throw error;
                numero = data.numero;
            } else {
                numero = 'R-' + (1000 + Math.floor(Math.random() * 9000));
            }
        } catch (x) {
            err.textContent = x.message || 'Impossible d’enregistrer la réservation. Réessayez.';
            err.style.display = 'block';
            t.disabled = false;
            return;
        }

        enCours = {
            numero, nom, T,
            jourLabel: day ? 'Demain' : 'Aujourd’hui',
            date: dt(day), slot, fin: end(slot),
            lignes: r.map(l => ({ n: l.n, q: l.q, p: l.p }))
        };
        put('resaEnCours', enCours);
        draw();   // si le client revient sans recharger la page, il voit l'étape 2
        window.location.href = waveLien(enCours);
    }

    // Étape 2 : le client a payé, il envoie sa réservation sur WhatsApp
    if ('sent' in d && enCours) {
        const S = enCours;
        window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(messageWhatsApp(S)), '_blank');
        done = S;
        enCours = null;
        try { localStorage.removeItem('resaEnCours') } catch (x) {}
        put('resa', {});
        draw();
    }
});

// Retour arrière depuis Wave : on relit l'état enregistré
window.addEventListener('pageshow', () => {
    if (done) return;
    enCours = get('resaEnCours', null);
    recalcul();
    draw();
});

// Affichage immédiat, puis mise à jour avec les prix Supabase
recalcul();
draw();
prixPrets.then(() => { if (!done && !enCours) { recalcul(); draw(); } });
</script>
</body>
</html>
