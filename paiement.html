<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paiement · CHEZSEPHO.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>
const WHATSAPP = "2250711336992";

let enCours = get('commandeEnCours', null);   // commande envoyée vers Wave, en attente de confirmation
let done = null;
let nomClient = '', telClient = '', adresseClient = '';

// Suivi du statut : Sepho valide dans son tableau de bord, le client le voit ici
const ETATS = {
    en_attente_paiement: ['⏳', 'Validation en attente', 'Sepho vérifie votre paiement Wave.', '#b7791f', '#fdf0d5'],
    payee: ['✓', 'Commande confirmée', 'Votre paiement est validé. Merci !', '#1f7a4d', '#e3f1e8'],
    en_preparation: ['✓', 'Commande en préparation', 'Vos crêpes sont en cours de préparation.', '#1f7a4d', '#e3f1e8'],
    en_livraison: ['✓', 'Commande en livraison', 'Votre livreur est en route.', '#1f7a4d', '#e3f1e8'],
    livree: ['✓', 'Commande livrée', 'Bon appétit !', '#1f7a4d', '#e3f1e8'],
    annulee: ['✕', 'Commande annulée', 'Contactez Sepho sur WhatsApp si besoin.', '#b3261e', '#fbe4e2']
};
let statut = 'en_attente_paiement', timer = null;
const barre = st => { const e = ETATS[st] || ETATS.en_attente_paiement;
    return `<div style="background:${e[4]};color:${e[3]};border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:600">${e[0]} ${e[1]}<br><small style="font-weight:400">${e[2]}</small></div>`; };

async function verifierStatut(S) {
    if (!S || !S.id || typeof sb === 'undefined' || !sb) return;
    try {
        await ensureAuth();
        const { data } = await sb.from('commandes').select('statut').eq('id', S.id).maybeSingle();
        if (data && data.statut !== statut) { statut = data.statut; draw(); }
    } catch (x) {}
}
function suivre(S) { clearInterval(timer); verifierStatut(S); timer = setInterval(() => verifierStatut(S), 10000); }

// Panier vide mais commande déjà envoyée : on réaffiche son suivi
if (!enCours && !lines().length) { const s = get('commandeSuivie', null); if (s) done = s; }

const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const waveLien = S => 'https://pay.wave.com/m/' + WAVE_ID + '/c/ci/?amount=' + Math.round(S.T);

function messageWhatsApp(S) {
    return 'Bonjour Sepho ! Voici ma commande CHEZSEPHO (paiement Wave effectué).\n\n' +
        'Commande : ' + S.numero + '\n' +
        'Nom : ' + S.nom + '\n' +
        'Téléphone : ' + S.tel + '\n' +
        'Livraison : ' + S.commune + '\n' +
        'Adresse : ' + S.adresse + '\n\n' +
        S.lignes.map(l => l.q + ' × ' + l.n + ' : ' + fmt(l.p * l.q)).join('\n') + '\n' +
        'Frais de livraison : ' + fmt(S.frais) + '\n\n' +
        'Total payé : ' + fmt(S.T) + '\n\n' +
        'Merci de confirmer ma commande.';
}

function draw() {
    // 3) Commande envoyée
    if (done) {
        const S = done;
        $('#app').innerHTML = head('Commande envoyée') +
            `<h1 class="t">Merci ${esc(S.nom)} !</h1>
            <div class="tk">
                <div class="ok"><b>Commande envoyée à Sepho</b><small>Votre numéro : ${S.numero}</small></div>
                ${barre(statut)}
                <div style="margin:10px 0">${list(S.lignes)}</div>
                <div class="row"><span>Livraison · ${esc(S.commune)}</span><b>${fmt(S.frais)}</b></div>
                <div class="row"><span>Adresse : ${esc(S.adresse)}</span></div>
                <div class="row tot"><span>Montant réglé</span><b>${fmt(S.T)}</b></div>
                <small>Sepho confirme votre commande sur WhatsApp dès que le paiement est vérifié.</small>
            </div>
            <p class="note">Si WhatsApp ne s'est pas ouvert, cliquez ci-dessous.</p>
            <a class="btn full" style="background:#25D366; color:white;"
               href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(messageWhatsApp(S))}">Ouvrir WhatsApp</a>
            <a class="link" href="index.html">Retour à l'accueil</a>`;
        return;
    }

    // 2) Retour de Wave : bouton pour envoyer le message WhatsApp
    if (enCours) {
        const S = enCours;
        $('#app').innerHTML = head('Paiement') +
            `<h1 class="t">Une dernière étape.</h1>
            <p class="mut">Avez-vous payé sur Wave ? Si oui, envoyez votre commande à Sepho pour qu'elle soit confirmée.</p>
            ${statut !== 'en_attente_paiement' ? barre(statut) : ''}
            <div class="sum">
                <b>Commande · ${S.numero}</b>
                ${list(S.lignes)}
                <div class="row"><span>Livraison · ${esc(S.commune)}</span><b>${fmt(S.frais)}</b></div>
                <div class="row"><span>Adresse : ${esc(S.adresse)}</span></div>
                <div class="row tot"><span>Montant à régler</span><b>${fmt(S.T)}</b></div>
            </div>
            <button class="btn full" data-sent style="background:#25D366; color:white;">
                J'ai payé · Envoyer ma commande à Sepho
            </button>
            <p class="note">Le message est déjà rédigé avec votre commande et votre adresse.</p>
            <a class="link" href="${waveLien(S)}">Payer maintenant avec Wave</a>
            <a class="link" href="#" data-cancel>Annuler et modifier ma commande</a>`;
        return;
    }

    const ls = lines();
    const commune = lieuLivraison();
    const frais = FEE();

    if (!ls.length) {
        $('#app').innerHTML = empty('Paiement');
        return;
    }

    if (mode() !== 'livraison' || frais === null) {
        $('#app').innerHTML = `
            ${head('Livraison')}
            <h1 class="t">Choisissez votre commune</h1>
            <p class="mut">Retournez dans votre panier pour choisir la commune et calculer les frais de livraison.</p>
            <a class="btn full" href="panier.html">Retour au panier</a>`;
        return;
    }

    // 1) Informations du client puis paiement
    const A = sub() + frais;
    $('#app').innerHTML =
        head('Paiement', '1/2') +
        `<h1 class="t">Un dernier geste, puis on se régale.</h1>
        <p class="mut">Vérifiez votre commande avant de payer.</p>

        <div class="wave">
            <b>Paiement par Wave</b>
            <small>Vous serez redirigé vers Wave avec le montant déjà rempli.</small>
            <div class="row"><span>Commune de livraison</span><b>${commune}</b></div>
            <div class="row"><span>Montant des crêpes</span><b>${fmt(sub())}</b></div>
            <div class="row"><span>Frais de livraison</span><b>${fmt(frais)}</b></div>
            <div class="row tot"><span>Montant total à régler</span><b>${fmt(A)}</b></div>
        </div>

        <h2 class="h2">Vos informations</h2>
        <label for="nom">Nom complet</label>
        <input id="nom" type="text" autocomplete="name" placeholder="Ex : Jean Dupont" value="${esc(nomClient)}">
        <label for="tel">Numéro de téléphone</label>
        <input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="+225 07 00 00 00 00" value="${esc(telClient)}">

        <label for="adresse">Adresse de livraison</label>
        <input id="adresse" type="text" autocomplete="street-address" placeholder="Quartier, rue, repère (ex : près de la pharmacie)" value="${esc(adresseClient)}">

        <div class="sum">
            <b>Votre commande</b>
            ${list(ls)}
            <div class="row"><span>Livraison · ${commune}</span><b>${fmt(frais)}</b></div>
            <div class="row tot"><span>Total</span><b>${fmt(A)}</b></div>
        </div>

        <p id="err" class="err" role="alert"></p>
        <button class="btn wavebtn full" data-pay>Payer ${fmt(A)} avec Wave</button>
        <p class="note">Après le paiement sur Wave, revenez ici pour envoyer votre commande à Sepho sur WhatsApp.</p>
        <a class="link" href="panier.html">Modifier ma commune ou ma commande</a>`;
}

document.addEventListener('input', e => {
    if (e.target.id === 'nom') nomClient = e.target.value;
    if (e.target.id === 'tel') telClient = e.target.value;
    if (e.target.id === 'adresse') adresseClient = e.target.value;
});

document.addEventListener('click', async e => {
    const a = e.target.closest('a[data-cancel]');
    if (a) {
        e.preventDefault();
        const ancienne = enCours;
        try { localStorage.removeItem('commandeEnCours') } catch (x) {}
        try { localStorage.removeItem('oid') } catch (x) {}
        if (ancienne && ancienne.id && typeof sb !== 'undefined' && sb) {
            try { await sb.rpc('annuler_commande', { p_id: ancienne.id }); } catch (x) {}
        }
        enCours = null;
        draw();
        return;
    }

    const t = e.target.closest('button');
    if (!t) return;
    const d = t.dataset;

    // Étape 1 : mémoriser la commande puis partir vers Wave
    if ('pay' in d) {
        const nom = ($('#nom').value || '').trim();
        const tel = ($('#tel').value || '').trim();
        const adresse = ($('#adresse').value || '').trim();
        const err = $('#err');
        err.style.display = 'none';

        if (!nom || !tel || !adresse) {
            err.textContent = 'Entrez votre nom, votre téléphone et votre adresse de livraison pour continuer.';
            err.style.display = 'block';
            return;
        }
        nomClient = nom; telClient = tel; adresseClient = adresse;

        const frais = FEE();
        const commune = lieuLivraison();
        const lignes = lines().map(l => ({ n: l.n, q: l.q, p: l.p, id: l.dbId || l.id }));
        t.disabled = true;
        const libelle = t.textContent;
        t.textContent = 'Enregistrement de la commande…';

        let enr = { numero: orderId(), id: null, frais: frais, T: sub() + frais };

        try {
            await prixPrets;
            if (typeof sb !== 'undefined' && sb) {
                await ensureAuth();
                const { data, error } = await sb.rpc('passer_commande', {
                    p_items: lignes.map(l => ({ produit_id: l.id, quantite: l.q })),
                    p_nom: nom,
                    p_telephone: tel,
                    p_commune: commune,
                    p_quartier: adresse
                });
                if (error) throw error;
                // Le serveur recalcule le total avec les prix de Supabase : c'est lui qui fait foi
                enr = { numero: data.numero, id: data.id, frais: data.frais_livraison, T: data.total };
            }
        } catch (x) {
            err.textContent = x.message || 'Impossible d’enregistrer la commande. Réessayez.';
            err.style.display = 'block';
            t.disabled = false;
            t.textContent = libelle;
            return;
        }

        enCours = {
            numero: enr.numero, id: enr.id, nom, tel, adresse,
            commune: commune, frais: enr.frais,
            T: enr.T,
            lignes: lignes
        };
        put('commandeEnCours', enCours);
        suivre(enCours);
        draw();   // si le client revient sans recharger la page, il voit l'étape 2
        window.location.href = waveLien(enCours);
    }

    // Étape 2 : le client a payé, il envoie sa commande sur WhatsApp
    if ('sent' in d && enCours) {
        const S = enCours;
        window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(messageWhatsApp(S)), '_blank');
        done = S;
        put('commandeSuivie', S);
        suivre(S);
        enCours = null;
        try { localStorage.removeItem('commandeEnCours'); localStorage.removeItem('oid'); } catch (x) {}
        put('cart', {});
        draw();
    }
});

// Retour arrière depuis Wave : on relit l'état enregistré
window.addEventListener('pageshow', () => {
    if (done) return;
    enCours = get('commandeEnCours', null);
    draw();
});

// Affichage immédiat, puis mise à jour avec les prix Supabase
draw();
if (done) suivre(done); else if (enCours) suivre(enCours);
prixPrets.then(() => { if (!done && !enCours) draw(); });
</script>
</body>
</html>
